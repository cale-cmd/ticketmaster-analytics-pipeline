name: Daily Ticketmaster ELT Pipeline

on:
  # 1. Run automatically every day at midnight UTC
  schedule:
    - cron: '0 0 * * *'
  # 2. Allow you to trigger the run manually with a button click on GitHub!
  workflow_dispatch:

jobs:
  run_pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository code
        uses: actions/checkout@v4

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Ensure MotherDuck support for dlt is installed
          pip install "dlt[motherduck]"

      - name: 4. Run dlt Extraction (API -> MotherDuck)
        env:
          # dlt automatically maps these exact environment variable names to your secrets.toml structure!
          SOURCES__API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          DESTINATION__MOTHERDUCK__CREDENTIALS__PASSWORD: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          python ticketmaster_pipeline.py

      - name: 5. Run dbt Transformations & Tests (Bronze -> Silver -> Gold)
        working-directory: ./ticketmaster_transforms
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          dbt run --profiles-dir .
          dbt test --profiles-dir .
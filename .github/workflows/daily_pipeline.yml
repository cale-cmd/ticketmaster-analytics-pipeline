name: Daily Ticketmaster ELT Pipeline

on:
  # 1. Run automatically every day at midnight UTC
  schedule:
    - cron: '0 0 * * *'
  # 2. Allow you to trigger the run manually with a button click on GitHub
  workflow_dispatch:

jobs:
  run_pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 1. Checkout repository code
        uses: actions/checkout@v6

      - name: 2. Set up Python
        uses: actions/setup-python@v6
        with:
          # Match the version you develop with locally
          python-version: '3.13'

      - name: 3. Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # No-ops if already in requirements.txt, otherwise fills the gap
          pip install "dlt[motherduck]" dbt-duckdb

      - name: 4. Run dlt Extraction (API -> MotherDuck)
        env:
          # dlt maps these environment variable names to your secrets.toml structure
          SOURCES__API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          DESTINATION__MOTHERDUCK__CREDENTIALS__PASSWORD: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          python ticketmaster_pipeline.py

      - name: 5. Run dbt Transformations & Tests (Bronze -> Silver -> Gold)
        working-directory: ./ticketmaster_transforms
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          # DuckDB's MotherDuck extension reads the lowercase name on Linux
          export motherduck_token="$MOTHERDUCK_TOKEN"
          dbt run --profiles-dir .
          dbt test --profiles-dir .